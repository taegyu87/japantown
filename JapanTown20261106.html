<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>사쿠라 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a painted pastoral map fills the screen; moss-green HUD band above, cloud-paper quest card floating top-left, build tray by role docked below. Single committed daytime look. */
:root{
  color-scheme: light;
  --moss:#2d4a43; --moss-2:#3a5c53; --moss-line:#527a6f;
  --cream:#fbf7ee; --ink:#2b2a26; --muted:#b9cfc6;
  --sun:#f4c04e; --shu:#e0603f; --sky:#a9d6ee;
  --f-display:"Jua","Gothic A1",system-ui,sans-serif;
  --f-kanji:"Zen Maru Gothic","Jua",sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--sky);color:var(--cream);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--moss);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.brand{font-family:var(--f-display);font-size:21px;color:var(--cream);margin-right:4px;display:flex;align-items:baseline;gap:6px}
.brand b{font-family:var(--f-kanji);font-weight:700;color:#ffc9d6;font-size:15px}
.stat{display:flex;align-items:center;gap:5px;background:var(--moss-2);border-radius:999px;padding:3px 9px 3px 3px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap;border:0;color:var(--cream);font-family:var(--f-body)}
.stat i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--f-kanji);font-weight:700;font-size:12px;color:var(--ink)}
.stat small{font-weight:600;color:var(--muted);font-size:11px}
.xpbar{width:50px;height:6px;border-radius:3px;background:var(--moss-line);overflow:hidden}
.xpbar span{display:block;height:100%;background:#ffc9d6;width:0}
button.stat{cursor:pointer}
button.stat:hover{background:var(--moss-line)}
.spacer{flex:1}
.short{display:none}
.btn{font:800 13px var(--f-body);color:var(--cream);background:var(--moss-2);border:0;border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--moss-line)}
.btn:focus-visible,.card:focus-visible,.tab:focus-visible,.stat:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.btn.primary{background:var(--shu);color:#fff}
.btn.primary:hover{background:#ec7556}
.btn.gold{background:var(--sun);color:var(--ink)}
.btn.gold:hover{background:#f8cf6f}
.btn:disabled{opacity:.45;cursor:not-allowed}
#stage{position:relative;flex:1;min-height:0}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
#quest{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));width:min(310px,calc(100% - 70px));background:var(--cream);color:var(--ink);border-radius:18px;box-shadow:0 6px 20px rgba(40,60,50,.22);z-index:4}
#quest header{display:flex;gap:10px;align-items:center;padding:9px 11px;cursor:pointer}
#quest header svg{flex:none}
#quest .who{font-family:var(--f-display);font-size:16px;color:#3b5a50}
#quest .say{font-size:12.5px;line-height:1.5;color:#4a4a42}
#quest ul{list-style:none;margin:0;padding:0 11px 11px;display:grid;gap:6px}
#quest li{background:#fff;border-radius:11px;padding:7px 9px;font-size:13px;font-weight:600;display:grid;gap:5px;box-shadow:inset 0 0 0 1.5px #ece4d2}
#quest li .row{display:flex;justify-content:space-between;gap:8px}
#quest li .rw{color:#a3661a;font-weight:800;white-space:nowrap;font-size:12px}
#quest li .pb{height:5px;border-radius:3px;background:#efe8d8;overflow:hidden}
#quest li .pb span{display:block;height:100%;background:#86c06a}
#quest.collapsed ul,#quest.collapsed .say{display:none}
#season{position:absolute;right:max(60px,calc(env(safe-area-inset-right,0px) + 60px));top:10px;z-index:4;background:rgba(251,247,238,.92);color:var(--ink);border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(40,60,50,.18);max-width:240px}
#season .sk{font-family:var(--f-kanji);font-weight:700;font-size:22px;line-height:1}
#season .st{font-size:11.5px;line-height:1.35;color:#4a4a42}
#season .st b{color:var(--ink);font-size:12.5px}
#season .sb{height:4px;border-radius:2px;background:#e8e0cf;margin-top:3px;overflow:hidden}
#season .sb span{display:block;height:100%;background:var(--ink);opacity:.5}
#zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;display:grid;gap:6px;z-index:4}
#zoom .btn{width:38px;height:38px;padding:0;font-size:18px;background:var(--moss);box-shadow:0 3px 10px rgba(0,0,0,.18)}
#pop,#report{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(380px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;background:var(--moss);border-radius:18px;box-shadow:0 10px 30px rgba(20,40,30,.35);padding:13px 15px;z-index:6;display:grid;gap:8px}
#pop h3,#report h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:24px}
.kj{font-family:var(--f-kanji);font-weight:700;font-size:14px;background:var(--cream);color:var(--ink);border-radius:7px;padding:1px 7px}
.jp{font-family:var(--f-kanji);font-size:12px;color:var(--muted);font-weight:500}
.chip{font:800 11px var(--f-body);color:var(--ink);border-radius:999px;padding:2px 8px}
#pop .info,#report .info{font-size:13px;color:var(--muted);line-height:1.55}
#pop .info b,#report b{color:var(--cream)}
#pop .bon{display:flex;flex-wrap:wrap;gap:5px}
#pop .bon span{font-size:11.5px;font-weight:700;background:var(--moss-2);border-radius:7px;padding:2px 7px}
#pop .note{font-size:12.5px;line-height:1.55;background:rgba(251,247,238,.08);border-radius:10px;padding:8px 10px;color:#e3ece7}
#pop .note em{font-style:normal;font-weight:800;color:var(--sun);display:block;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
#pop .acts{display:flex;flex-wrap:wrap;gap:8px}
#pop .acts .btn{flex:1 1 110px;display:grid;gap:1px;text-align:center}
#pop .acts .btn small{font-weight:600;font-size:11px;opacity:.85}
.x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:2px 8px}
.prog{height:8px;border-radius:4px;background:var(--moss-line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--sun)}
#report table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
#report td{padding:5px 2px;border-bottom:1px solid var(--moss-line);vertical-align:top}
#report td:last-child{text-align:right;font-weight:800;white-space:nowrap}
#report .sec{font:800 11px var(--f-body);letter-spacing:.08em;color:var(--sun);margin-top:4px}
#report .seas{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;color:#e3ece7}
#report .seas b{font-family:var(--f-kanji);font-size:15px}
#tray{background:var(--moss);padding-block:7px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:grid;gap:7px;box-shadow:0 -2px 0 rgba(0,0,0,.12)}
#tray .top{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap}
.tab{font:800 13px var(--f-body);background:transparent;color:var(--muted);border:0;border-radius:9px;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:5px}
.tab i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tab[aria-selected="true"]{color:var(--ink);background:var(--cream)}
#mode{font-size:12.5px;color:var(--sun);font-weight:700;min-width:0}
#cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.card{flex:none;width:104px;background:var(--moss-2);border:2px solid transparent;border-radius:14px;padding:5px 6px 7px;color:var(--cream);cursor:pointer;display:grid;justify-items:center;gap:2px;font-family:var(--f-body);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--cc)}
.card canvas{width:84px;height:70px}
.card .nm{font-size:12px;font-weight:800;text-align:center;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.card .cs{font-size:12px;font-weight:800;color:var(--sun);font-variant-numeric:tabular-nums}
.card .meta{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3}
.card.sel{border-color:var(--sun);background:var(--moss-line)}
.card.locked{opacity:.5;cursor:not-allowed}
.card.locked::after{content:attr(data-lock);position:absolute;top:8px;right:6px;background:var(--ink);color:var(--cream);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.card.poor .cs{color:#ff9f86}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:7;display:grid;gap:6px;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.t{background:var(--moss);color:var(--cream);padding:8px 13px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .25s ease-out;max-width:100%}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
.modal{position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:rgba(30,50,42,.4)}
.modal .box{background:var(--cream);color:var(--ink);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:18px 22px;text-align:center;display:grid;gap:8px;width:min(330px,calc(100% - 32px))}
.modal .big{font-family:var(--f-display);font-size:36px;color:var(--shu)}
.modal p{margin:0;font-size:13.5px;line-height:1.55}
.modal .acts{display:flex;gap:8px;justify-content:center}
.modal .btn:not(.primary){background:#e6dfcf;color:var(--ink)}
@media (max-width:600px){
  .brand span{display:none}
  .stat{font-size:12.5px;padding-right:7px}
  .stat small{display:none}
  #hud .spacer{display:none}
  #hud .btn{padding:5px 8px;font-size:12px}
  #music span{display:none}
  .short{display:inline}.long{display:none}
  #quest{width:min(250px,calc(100% - 70px))}
  #season{top:auto;bottom:10px;right:max(12px,env(safe-area-inset-right,0px))}
  #season .st span{display:none}
}
@media (prefers-reduced-motion:reduce){.t{animation:none}}
.qbadge{font:800 11px var(--f-body);background:var(--shu);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
#quest li.done{box-shadow:inset 0 0 0 2px var(--sun);background:#fffbe9}
.claim{font:800 12.5px var(--f-body);background:var(--sun);color:var(--ink);border:0;border-radius:9px;padding:6px 10px;cursor:pointer;animation:glow 1.4s ease-in-out infinite}
.claim:hover{background:#f8cf6f}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(244,192,78,.35)}}
.pager{display:flex;align-items:center;gap:4px;font:800 12px var(--f-body);color:var(--cream);font-variant-numeric:tabular-nums}
.pager .btn{padding:4px 8px}
.lvb{position:absolute;top:7px;left:6px;font:800 10px var(--f-body);background:rgba(43,42,38,.75);color:var(--cream);border-radius:6px;padding:1px 5px}
.card .tg{font-size:10px;font-weight:700;color:#ffd9a0;text-align:center;line-height:1.25}
.card.locked::after{content:"잠김"}
#pop .traits{display:grid;gap:4px}
#pop .traits span{font-size:12px;line-height:1.4;background:rgba(244,192,78,.12);border-radius:8px;padding:4px 8px;color:#e3ece7}
#pop .traits b{color:var(--sun);margin-right:4px}
#pop .warn{font-size:12.5px;font-weight:700;background:rgba(224,96,63,.22);color:#ffd6cc;border-radius:9px;padding:6px 9px}
#pop .up{display:grid;gap:6px;border-top:1px solid var(--moss-line);padding-top:8px}
#pop .uh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
#pop .uh span{color:var(--muted);font-size:11.5px}
.lvchip{background:var(--cream)}
#music.on{background:var(--moss-line)}
#music span{display:inline-block;max-width:96px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
@media (max-width:1500px){#funM{display:none}}
#quick{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;z-index:4;display:flex;gap:6px}
#quick .btn{box-shadow:0 3px 10px rgba(0,0,0,.22)}
#quick .btn.dim{opacity:.6}
#viewbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;background:rgba(30,32,28,.6);color:#fff;padding:7px 8px 7px 14px;border-radius:16px;backdrop-filter:blur(4px);max-width:calc(100% - 32px)}
#viewbar span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.viewing #hud,body.viewing #quest,body.viewing #tray,body.viewing #zoom,body.viewing #season,body.viewing #evbar,body.viewing #quick,body.viewing #pop,body.viewing #report{display:none!important}
.btn.town{background:#3f6e9a;color:#fff;border-color:#2f5a82;padding:7px 9px}
@media (max-width:1400px){#hud .brand span{display:none}}
.btn.town.locked{background:#7a8a96;opacity:.85}
body.kr .brand b{color:#c9e0ff}
#qface{display:flex}
#evbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;background:linear-gradient(90deg,#e0603f,#f0a63a);color:#fff;border-radius:14px;padding:6px 14px;display:grid;justify-items:center;gap:1px;box-shadow:0 4px 14px rgba(120,50,20,.3);max-width:min(360px,calc(100% - 140px));text-align:center}
#evbar b{font-family:var(--f-display);font-weight:400;font-size:15px}
#evbar span{font-size:11.5px;font-weight:700;opacity:.95}
@media (max-width:600px){#evbar{top:auto;bottom:56px}}
#saveModal .box{width:min(420px,calc(100% - 32px));text-align:left}
#saveModal textarea{width:100%;height:110px;resize:vertical;font:11px ui-monospace,Menlo,Consolas,monospace;border:1px solid #d8cfba;border-radius:10px;padding:8px;background:#fff;color:var(--ink);box-sizing:border-box;word-break:break-all}
#saveModal .acts{justify-content:flex-end;flex-wrap:wrap}
.req{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:0 11px 8px;padding:6px 8px;border-radius:10px;background:#f3ecdc;font-size:11.5px;font-weight:700;color:#6a5a40}
.req b{color:#3b5a50;font-size:12px}
.req span{background:#fff;border-radius:7px;padding:1px 6px;box-shadow:inset 0 0 0 1px #e6dcc8}
.req span.ok{background:#e4f3d6;color:#3f7a3a;box-shadow:inset 0 0 0 1px #b9dca0}
.req span.ok::before{content:"✓ "}
#quest.collapsed .req{display:flex;margin-top:-4px}
.xpbar span.full{background:var(--sun)}
#music span{max-width:9em;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
@media (max-width:600px){#music span{display:none}}

#music b{color:var(--sun)}
@media (prefers-reduced-motion:reduce){.claim{animation:none}}

</style>

<div id="app">
  <div id="hud">
    <div class="brand"><b>桜町</b><span>사쿠라 마을</span></div>
    <button class="btn town" id="townBtn">한국 마을</button>
    <div class="stat" title="레벨"><i style="background:#ffc9d6">級</i><span id="lv">1</span><div class="xpbar"><span id="xpb"></span></div></div>
    <div class="stat" title="엔"><i id="curI" style="background:var(--sun)">円</i><span id="coins">0</span></div>
    <div class="stat" title="기운 (공급·세일에 사용)"><i style="background:#86c06a">気</i><span id="en">0</span><small id="enT"></small></div>
    <button class="stat" id="openReport" title="마을 현황 보기"><i style="background:#9fd3e6">客</i><span id="tour">0</span><small id="mult"></small></button>
    <button class="stat" id="openReport2" title="경관 점수"><i style="background:#ef8fb3">美</i><span id="beauty">0</span></button>
    <button class="stat" id="openReport3" title="청결도"><i style="background:#5bb8cc">清</i><span id="clean">100%</span></button>
    <div class="stat" id="funStat" title="재미 (테마파크) · 관광객이 늘어요" hidden><i style="background:#c77dff">樂</i><span id="fun">0</span><small id="funM"></small></div>
    <div class="spacer"></div>
    <button class="btn" id="music" aria-pressed="false" title="배경음악"><b>♪</b> <span>음악</span></button><button class="btn" id="mnext" aria-label="다음 곡" title="다음 곡" hidden>⏭</button>
    <button class="btn gold" id="expand">땅 확장</button>
    <button class="btn" id="saveBtn" title="지금 마을을 컴퓨터에 파일로 저장">저장</button>
    <button class="btn" id="loadBtn" title="저장한 파일을 불러와 이어서 하기">불러오기</button>
    <input type="file" id="loadFile" accept=".json,.txt,application/json,text/plain" hidden>
    <button class="btn" id="reset" aria-label="새로 시작"><span class="long">새로 시작</span><span class="short">↺</span></button>
  </div>
  <div id="stage">
    <canvas id="map" aria-label="마을 지도"></canvas>
    <section id="quest">
      <header id="qhead" title="눌러서 접기/펼치기">
        <span id="qface"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
          <circle cx="8" cy="23" r="6.5" fill="#d79c6c"/><circle cx="38" cy="23" r="6.5" fill="#d79c6c"/>
          <circle cx="23" cy="24" r="16.5" fill="#9b6544"/>
          <path d="M11 26c0-7 5-11 12-11s12 4 12 11c0 7-5 10.5-12 10.5S11 33 11 26z" fill="#f4d3ae"/>
          <ellipse cx="17.5" cy="25" rx="2" ry="2.4" fill="#3a2a22"/><ellipse cx="28.5" cy="25" rx="2" ry="2.4" fill="#3a2a22"/>
          <circle cx="18.2" cy="24.2" r=".7" fill="#fff"/><circle cx="29.2" cy="24.2" r=".7" fill="#fff"/>
          <ellipse cx="14" cy="29.5" rx="2.4" ry="1.4" fill="#f2a39a" opacity=".7"/><ellipse cx="32" cy="29.5" rx="2.4" ry="1.4" fill="#f2a39a" opacity=".7"/>
          <path d="M20 31q3 2.2 6 0" stroke="#3a2a22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M9 12q14-8 28 0l-2 3q-12-5-24 0z" fill="#5b7f55"/><ellipse cx="23" cy="10.5" rx="7" ry="3.2" fill="#6f9466"/>
        </svg></span>
        <div><div class="who"><span id="qname">사루 촌장</span> <span id="qbadge" class="qbadge" hidden></span></div><div class="say" id="say"></div></div>
      </header>
      <div id="req" class="req"></div><ul id="qlist"></ul>
    </section>
    <div id="season"></div>
    <div id="evbar" hidden></div>

const pw=L=>Math.pow(1.105,L-1)*(1+.04*(L-1));
const polyL=(L,e)=>Math.pow(1+.25*(L-1),e);
const growth=L=>.45-.35*(L-1)/(MAXLV-1);
const B={}, BYLV=[[]];
function mk(L,j,art,R){
  const a=ARCH[art], cat=a.cat, p=pw(L), id=art+'@'+L;
  const d={id,art,L,cat,zone:a.zone,jp:a.jp,kj:a.kj,note:a.note,g:growth(L),traits:[...(a.traits||[])]};
  const MD=art.startsWith('k_')?MODS_K:art.startsWith('p_')?MODS_P:MODS; d.name=(L===1||((L===KR_MIN||L===50)&&art.startsWith('k_'))||(L===PARK_MIN&&art.startsWith('p_'))?'':MD[1+((L*7+j*3)%(MD.length-1))]+' ')+a.name;
  d.hue=L===1?0:(cat==='beauty'||cat==='attract')?((L*13+j*7)%40)-20:((L*47+j*83)%320)-160;
  if(a.smul) d.smul=a.smul.slice();
  if(a.syn){ d.syn={with:a.syn,b:.5,r:2}; d.traits.push('syn'); }
  const pick=(pool,n)=>{ const out=[]; const pl=pool.filter(t=>!d.traits.includes(t)); for(let i=0;i<n&&pl.length;i++){ out.push(pl.splice((R()*pl.length)|0,1)[0]); } return out; };
  const seasonal=()=>{ const s=(R()*4)|0; d.smul=[1,1,1,1]; d.smul[s]=2.2; d.smul[(s+2)%4]=.6; d.sAt=s; };
  if(cat==='income'){
    if(a.auto){ d.auto={every:a.auto,pay:2.5*p*a.auto*.6}; d.cost=Math.round(220*p);
      if(L>1) for(const t of pick(['tour','famous','road','tidy','seasonal'].filter(t=>!(t==='seasonal'&&d.smul)),L>=40?2:1)) d.traits.push(t); }
    else { d.time=a.time; d.earn=2.5*p*a.time; d.cost=Math.round(100*p*a.cf);
      if(L>1){ let pool=['fast','premium','crit','loyal','thrift','noE','tour','combo','road','xpT','famous','tidy','seasonal'];
        if(d.traits.includes('fast')||d.traits.includes('premium')) pool=pool.filter(t=>t!=='fast'&&t!=='premium');
        if(d.smul) pool=pool.filter(t=>t!=='seasonal');
        for(const t of pick(pool,L>=40?2:1)){ d.traits.push(t); if(t==='fast'||t==='premium') pool=pool.filter(x=>x!=='fast'&&x!=='premium'); } } }
    if(d.traits.includes('fast')){ d.time*=.5; d.earn*=.55; }
    if(d.traits.includes('premium')){ d.time*=2; d.earn*=2.6; d.cost=Math.round(d.cost*1.3); }
    if(d.traits.includes('seasonal')&&!d.sAt) seasonal();
    d.attract=d.traits.includes('famous')?4*polyL(L,1.2):1;
  } else if(cat==='attract'){
    d.attract=10*polyL(L,1.25)*a.cf; d.cost=Math.round(250*p*a.cf); d.fee=2.5*p*3*a.cf;
    if(a.beautyR) d.beauty=d.attract*a.beautyR; if(a.aura){ d.aura=a.aura+.08*L/MAXLV; d.r=a.r+Math.floor(L/60); }
    if(a.regen) d.regen=a.regen+.1*L/MAXLV;
    if(a.auto) d.auto={every:a.auto,pay:2.5*p*a.auto*.5};
    if(L>1) for(const t of pick(['tips','pretty','rest','seasonal'].filter(t=>!(t==='seasonal'&&d.smul)&&!(t==='tips'&&d.auto)),1)){ d.traits.push(t);
      if(t==='tips') d.auto={every:25,pay:2.5*p*25*.25}; if(t==='pretty') d.beauty=(d.beauty||0)+d.attract*.3; if(t==='rest') d.regen=(d.regen||0)+.08; if(t==='seasonal') seasonal(); }
  } else if(cat==='beauty'){
    d.beauty=4*polyL(L,1.2)*a.sz; d.aura=(.06+.14*L/MAXLV)*(a.auraX||1); d.r=(a.r||1)+Math.floor(L/60); d.cost=Math.round(60*p*Math.pow(a.sz,.6));
    if(L>1) for(const t of pick(['wide','strong','seasonal'].filter(t=>!(t==='seasonal'&&d.smul)),1)){ d.traits.push(t); if(t==='wide') d.r++; if(t==='strong') d.aura*=1.5; if(t==='seasonal') seasonal(); }
  } else if(cat==='clean'){
    d.r=a.r?a.r+Math.floor(L/40):0; d.every=a.every*Math.max(.3,1-L/300); if(a.litterRed) d.litterRed=a.litterRed+.2*L/MAXLV; d.cost=Math.round(50*p*a.cf);
  } else {
    const f=L/MAXLV; d.cost=Math.round(180*p*a.cf);
    if(a.spd){ d.spd=a.spd+.15*f; d.r=a.r+Math.floor(L/40); }
    if(a.saleB){ d.saleB=a.saleB+1.6*f; d.r=a.r+Math.floor(L/50); }
    if(a.regen) d.regen=a.regen+.3*f; if(a.xp) d.xp=a.xp+.35*f; if(a.gspd) d.gspd=a.gspd+.08*f;
    if(a.maxE) d.maxE=a.maxE+Math.floor(L/10); if(a.tmul) d.tmul=a.tmul+.25*f; if(a.scDisc) d.scDisc=a.scDisc+.2*f;
    if(a.attractR) d.attract=10*polyL(L,1.25)*a.attractR;
  }
  B[id]=d; return id;
}

const inLand=(x,y)=>x>=C-S.land&&x<C+S.land&&y>=C-S.land&&y<C+S.land;

/* ===================================================== economy */
const uF=(d,u)=>Math.pow(1+d.g,u||0);
const uS=u=>Math.min(3,1+.05*(u||0));
const upCost=(d,u)=>d.cost*Math.pow(1.5,u||0);
function eff(o){ const d=B[o.t], u=o.u||0, m=uF(d,u), s=uS(u), e={};
  if(d.earn) e.earn=d.earn*m; if(d.auto) e.pay=d.auto.pay*m; if(d.fee) e.fee=d.fee*m;
  if(d.attract) e.attract=d.attract*m; if(d.beauty) e.beauty=d.beauty*m;
  if(d.aura) e.aura=d.aura*Math.min(3,1+.04*u);
  e.r=d.r>0?d.r+Math.floor(u/12):(d.r||0);
  if(d.every) e.every=Math.max(.3,d.every/(1+.08*u));
  for(const k of ['spd','saleB','regen','xp','gspd','tmul','scDisc','litterRed']) if(d[k]) e[k]=d[k]*s;
  if(d.maxE) e.maxE=Math.round(d.maxE*s);
  return e; }
let G={beauty:0,attract:0,gspd:0,regen:0,xp:0,maxE:0,litterRed:0,tmul:0,scDisc:0,cleaners:[],autos:[],bonus:{},ok:{},eff:{},conn:new Set(),connList:[],fronts:[],attFronts:[]}, dirty=true, lastSeason=-1;
function computeConn(){
  const conn=new Set([ENTK]), q=[ENT];
  while(q.length){ const [x,y]=q.shift(); for(const [dx,dy] of N4){ const k=(x+dx)+','+(y+dy); if(!conn.has(k)&&S.roads[k]&&inLand(x+dx,y+dy)){ conn.add(k); q.push([x+dx,y+dy]); } } }
  return conn;
}
function touchesConn(x,y,conn){ for(const [dx,dy] of N4) if(conn.has((x+dx)+','+(y+dy))) return true; return false; }
function bonusAt(x,y,d,s,skip){
  let b=0, sp=0, sale=0, syn=false, combo=0, roads=0;
  for(const k in S.tiles){ if(k===skip) continue;
    const o=S.tiles[k], e=B[o.t], [tx,ty]=kxy(k), dist=cheb(x,y,tx,ty), ef=G.eff[k]||eff(o), ok=G.ok[k]!==false;
    if(e.aura&&(ok||e.cat==='beauty')&&dist<=ef.r) b+=ef.aura*(e.cat==='beauty'?sm(e,s):1);
    if(ok&&ef.spd&&dist<=ef.r) sp+=ef.spd;
    if(ok&&ef.saleB&&dist<=ef.r) sale+=ef.saleB;
    if(d.syn&&d.syn.with.includes(e.art)&&dist<=d.syn.r) syn=true;
    if(has(d,'combo')&&e.cat==='income'&&dist<=1) combo++;
  }
  for(const [dx,dy] of N4) if(isRoad((x+dx)+','+(y+dy))) roads++;
  return {b,sp:Math.min(.7,sp),sale,syn,combo:Math.min(4,combo),roads};
}
function recompute(){
  const s=season(); const g={fun:0,beauty:0,attract:0,gspd:0,regen:0,xp:0,maxE:0,litterRed:0,tmul:0,scDisc:0,cleaners:[],autos:[],bonus:{},ok:{},eff:{},conn:null,connList:[],fronts:[]};
  g.conn=computeConn(); g.connList=[...g.conn].map(kxy);
  G=g;
  for(const k in S.tiles){ const o=S.tiles[k], [x,y]=kxy(k); g.eff[k]=eff(o); g.ok[k]=!needsRoad(o.t)||touchesConn(x,y,g.conn); }
  const fr=new Set(), afr=new Set();
  for(const k in S.tiles){
    const o=S.tiles[k], d=B[o.t], e=g.eff[k], [x,y]=kxy(k);
    if(g.ok[k]&&needsRoad(o.t)) for(const [dx,dy] of N4){ const kk=(x+dx)+','+(y+dy); if(g.conn.has(kk)){ fr.add(kk); if(d.cat==='attract') afr.add(kk); } }
    if(!g.ok[k]) continue;
    const m=sm(d,s);
    if(d.zone==='park') g.fun+=((e.attract||0)+(e.beauty||0)*.6)*m;
    else { if(e.beauty) g.beauty+=e.beauty*(d.cat==='beauty'?m:1);
    if(e.attract) g.attract+=e.attract*(d.cat==='attract'?m:1); }
    g.gspd+=e.gspd||0; g.regen+=e.regen||0; g.xp+=e.xp||0; g.maxE+=e.maxE||0; g.litterRed+=e.litterRed||0; g.tmul+=e.tmul||0; g.scDisc+=e.scDisc||0;
    if(d.cat==='clean') g.cleaners.push({k,x,y,r:e.r,every:e.every});
    if(has(d,'tidy')) g.cleaners.push({k:k+'t',x,y,r:1,every:5});
    if(d.auto) g.autos.push({k,x,y,every:d.auto.every,pay:e.pay,d});
  }
  g.fronts=[...fr].map(kxy); g.attFronts=[...afr].map(kxy);
  g.gspd=Math.min(.6,g.gspd); g.litterRed=Math.min(.8,g.litterRed); g.scDisc=Math.min(.85,g.scDisc); g.tmul=Math.min(5,g.tmul); g.xp=Math.min(5,g.xp); g.regen=Math.min(5,g.regen);
  for(const k in S.tiles){ const o=S.tiles[k]; if(B[o.t].cat==='income'){ const [x,y]=kxy(k); g.bonus[k]=bonusAt(x,y,B[o.t],s,k); } }
  dirty=false;
}
const maxEnergy=()=>13+Math.min(S.lv,60)*2+G.maxE;
const litterCap=()=>6+S.land*2.5;
const cleanPct=()=>Math.max(0,Math.min(1,1-S.litter.length/litterCap()));
const beautyF=()=>1+.4*Math.log(1+G.beauty*evMul('beauty')/30);
const cleanF=()=>.5+.5*cleanPct();
const funF=()=>1+.2*Math.log(1+(G.fun||0)/80);
function tourists(){ return Math.round((G.attract+BASE_ATTR)*2*beautyF()*cleanF()*SEASON_TOUR[season()]*evMul('tour')*funF()); }
const incomeMult=()=>(1+.5*Math.log(1+tourists()/40))*(1+G.tmul);
function scOf(k){ const o=S.tiles[k], d=B[o.t], e=G.eff[k]||eff(o); return Math.max(1,Math.round(e.earn*.25*(has(d,'thrift')?.3:1)*(1-G.scDisc)*evMul('sc'))); }
function energyOf(k,sale){ const d=B[S.tiles[k].t]; return has(d,'noE')?(sale?2:0):(sale?3:1); }
function shopDur(k){ const o=S.tiles[k], d=B[o.t], b=G.bonus[k]||{sp:0}; return d.time*1000*Math.max(.25,(1-b.sp)*(1-G.gspd)); }
function shopEarn(k,sale){
  const o=S.tiles[k], d=B[o.t], e=G.eff[k]||eff(o), b=G.bonus[k]||{b:0,syn:false,combo:0,sale:0,roads:0};
  let v=e.earn*(1+b.b)*(b.syn?1+d.syn.b:1)*(1+b.combo*.15)*sm(d,season())*evMul('earn')*(isSeaZ(d.zone)?evMul('sea'):1);
  if(has(d,'road')) v*=1+.15*b.roads;
  if(has(d,'loyal')) v*=1+Math.min(.9,.06*(o.loyal||0));
  if(has(d,'tour')) v*=1+.25*Math.log(1+tourists()/50);
  return v*(sale?2.3+(b.sale||0):1);
}

function paintRoad(x,y){
  const k=x+','+y; if(!painting||painting.last===k) return; painting.last=k;
  if(x<0||y<0||x>=N||y>=N||k===ENTK) return;
  if(buildType!=='unroad'){
    const st=roadStyle(), rs=ROADS[st];
    if(!inLand(x,y)||S.tiles[k]||S.roads[k]===st) return;
    if(zoneOf(x,y)==='sea'&&!rs.sea){ if(!painting.warned){ painting.warned=1; toast('바다 위에는 나무 데크만 깔 수 있어요.'); } return; }
    if(S.coins<rs.cost){ toast('돈이 부족해요'); return; }
    S.coins-=rs.cost; if(!S.roads[k]) S.stats.roads++; S.roads[k]=st; sfx('road');
  } else { if(!S.roads[k]) return; S.coins+=Math.floor((ROADS[S.roads[k]]||ROADS[1]).cost/2); delete S.roads[k]; sfx('road'); }

function collect(k,quiet){
  const o=S.tiles[k], d=B[o.t]; let gain=o.earn*incomeMult(), crit=false;

  S.coins+=gain; S.stats.collect++; if(has(d,'loyal')) o.loyal=Math.min(15,(o.loyal||0)+1);
  addXP(gain*.05*(has(d,'xpT')?3:1));
  o.st='idle'; delete o.end; delete o.sale; delete o.dur;
  const [x,y]=kxy(k), [wx,wy]=iso(x+.5,y+.5); floatAt(wx,wy-56,(crit?'대박! ':'')+'+'+Y+fmt(gain),crit?'#ffb0d0':'#ffe08a'); if(quiet) return; sfx(crit?'claim':'coin');

}
function startShop(k,sale){
  const o=S.tiles[k]; if(!G.ok[k]) return 'r';

  if(S.energy>=maxEnergy()) S.eT=Date.now();
  S.energy-=ec; S.coins-=cc; const dur=shopDur(k);
  Object.assign(o,{st:'prod',end:Date.now()+dur,dur,earn:shopEarn(k,sale),sale:!!sale});
  S.stats.supply++; if(sale) S.stats.sale++;
  return '';
}

}
function snowFace(c,a1,a2,b1,b2,fr,dark){

    if(w.path.length){ const t=w.path[0], tx=t[0]+.5+w.ofx, ty=t[1]+.5+w.ofy, dx=tx-w.x, dy=ty-w.y, d=Math.hypot(dx,dy);

let litterAcc=0; const cleanT={}, autoT={};

function updateLitter(dt){
  const T=tourists();
  litterAcc+=.06*Math.log(1+T/15)*(1+.15*Math.log(1+(G.fun||0)/40))*SEASON_LITTER[season()]*(1-G.litterRed)*dt;
  if(litterAcc>=1){ litterAcc-=1; if(S.litter.length<45){
    const roads=G.connList.filter(([x,y])=>!(x===ENT[0]&&y===ENT[1]));
    const pool=roads.length&&Math.random()<.7?roads:emptyLandTiles();
    if(pool.length){ const [x,y]=pool[(Math.random()*pool.length)|0]; S.litter.push([x+.25+Math.random()*.5,y+.25+Math.random()*.5,(Math.random()*3)|0]); } } }
  for(const cl of G.cleaners){ cleanT[cl.k]=(cleanT[cl.k]||0)+dt; if(cleanT[cl.k]<cl.every) continue; cleanT[cl.k]=0;
    let best=-1, bd=1e9; S.litter.forEach((l,i)=>{ const dd=cheb(cl.x,cl.y,Math.floor(l[0]),Math.floor(l[1])); if((cl.r===0||dd<=cl.r)&&dd<bd){bd=dd;best=i;} });
    if(best>=0){ const l=S.litter.splice(best,1)[0]; const [wx,wy]=iso(l[0],l[1]); sparks.push({x:wx,y:wy,t:0}); } }
  for(const a of G.autos){ autoT[a.k]=(autoT[a.k]||0)+dt; if(autoT[a.k]<a.every) continue; autoT[a.k]=0;
    let gain=a.pay*incomeMult()*sm(a.d,season())*(isSeaZ(a.d.zone)?evMul('sea'):1);
    if(has(a.d,'tour')) gain*=1+.25*Math.log(1+tourists()/50);

    S.coins+=gain; S.stats.auto++; addXP(gain*.15); const [wx,wy]=iso(a.x+.5,a.y+.5); floatAt(wx,wy-40,'+'+Y+fmt(gain),'#ffe08a'); }
}

    if(G.ok[it.k]===false) noRoad(ctx,o,cx,cy,now); else if(isShop(o.t)) bubble(ctx,o,cx,cy,now); }

  if(s===1) for(const k in S.tiles) if(B[S.tiles[k].t].art==='hanabi'&&G.ok[k]&&Math.random()<dt*.8){ const [x,y]=kxy(k), [wx,wy]=iso(x+.5,y+.5); bursts.push({x:wx+(Math.random()-.5)*140,y:wy-130-Math.random()*90,t:0,c:['#f4c04e','#ef8fb3','#7fd0ef','#ff8a5c','#c9f08a'][(Math.random()*5)|0]}); }
  for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.t+=dt; if(b.t>1.5){bursts.splice(i,1);continue;}

function noRoad(c,o,cx,cy,time){ const sp=vsprite(o.t,season(),(o.f?1:0)^(rot&1)), top=cy+sp.top*BK-10+Math.sin(time/300)*1.5;

function parseSave(text){
  let o=JSON.parse(String(text).trim()); const st=o&&o.state?o.state:o;

  return st;

}

    [['지금 마을 먼저 저장','',()=>{ smClose(); $('saveBtn').click(); }],['취소','',smClose],['불러오기','primary',()=>applyLoad(st)]]);
}
function loadErr(e){ toast(e&&e.message==='ver'?'다른 버전의 저장 파일이라 불러올 수 없어요.':'사쿠라 마을 저장 파일이 아니거나 내용이 손상됐어요.'); }
$('loadBtn').onclick=()=>{
  smOpen('마을 불러오기','저장해 둔 <b>.json</b> 또는 <b>.txt</b> 파일을 고르거나, 저장 코드를 아래에 붙여 넣으세요.','',
    [['파일 고르기','primary',()=>$('loadFile').click()],['붙여 넣은 코드로 불러오기','',()=>{ try{ confirmLoad(parseSave($('smCode').value),'붙여 넣은'); }catch(e){ loadErr(e); } }],['닫기','',smClose]]);
  $('smCode').readOnly=false; $('smCode').placeholder='여기에 저장 코드를 붙여 넣으세요';
};
$('loadFile').onchange=e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{ confirmLoad(parseSave(rd.result),`"${f.name}"`); }catch(err){ loadErr(err); } }; rd.onerror=()=>toast('파일을 읽지 못했어요.'); rd.readAsText(f); };
smEl.addEventListener('click',e=>{ if(e.target===smEl) smClose(); });
document.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return; e.preventDefault();
  const rd=new FileReader(); rd.onload=()=>{ try{ confirmLoad(parseSave(rd.result),`"${f.name}"`); }catch(err){ loadErr(err); } }; rd.readAsText(f); });

/* ===================================================== KOREA: two towns */
const TOWN_F=['tiles','roads','litter','land','qa','qn'];
const EXPAND_K={4:6000,5:4.5e4,6:3.5e5,7:3e6,8:2.5e7,9:2e8};
function freshKr(){ const roads={}; for(const k of [[0,2],[0,1],[0,0],[-1,0],[1,0],[0,-1]].map(([a,b])=>(C+a)+','+(C+b))) roads[k]=1;
  const id=a=>a+'@'+KR_MIN;
  return {land:4,qn:0,qa:[],roads,litter:[[C-1.6,C-1.4,0],[C+2.5,C+1.3,1]],
    tiles:{[(C-1)+','+(C-1)]:{t:id('k_tteok'),st:'idle',u:0},[(C+1)+','+(C-1)]:{t:id('k_jangseung'),u:0},[(C-1)+','+(C+1)]:{t:id('k_mugung'),u:0},[(C+1)+','+(C+1)]:{t:id('k_mugung'),u:0},[(C-2)+','+C]:{t:id('k_sonamu'),u:0}}}; }
const JP_FACE=$('qface')?$('qface').innerHTML:'';
const KR_FACE=`<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#e3ecf4"/>
  <path d="M29 30l13 7-2 3-13-6z" fill="#24364a"/><ellipse cx="22" cy="29" rx="12" ry="10" fill="#1d2430"/><ellipse cx="19.5" cy="31.5" rx="7" ry="6.6" fill="#fbfbf5"/>
  <path d="M25 23q9 2 10 10q-7-1-11-6z" fill="#3a6a9a"/><circle cx="21" cy="17.5" r="9" fill="#1d2430"/>
  <circle cx="24.4" cy="16" r="2.3" fill="#fff"/><circle cx="25" cy="16" r="1.15" fill="#1d2430"/><path d="M29.5 17.5l7 1.6-7 1.6z" fill="#4a4a4a"/>
  <ellipse cx="25" cy="21" rx="2" ry="1.1" fill="#f2a39a" opacity=".75"/>
  <ellipse cx="20" cy="9.6" rx="11.5" ry="2.4" fill="#2b2a26" opacity=".92"/><rect x="15.4" y="2.6" width="9.2" height="7" rx="2.2" fill="#2b2a26"/><path d="M11 10q2 9 7 10" stroke="#2b2a26" stroke-width=".8" fill="none"/></svg>`;
const totTour=()=>tourists()+(S.alt&&S.alt.snap?S.alt.snap.T:0);
const totAtt=()=>attCount()+(S.alt&&S.alt.snap?S.alt.snap.att:0);
function applyTownUI(){ const kr=S.town==='kr';
  Y=kr?'₩':'¥';
  const br=document.querySelector('.brand'); if(br) br.innerHTML=kr?'<b>槿花里</b><span>무궁화 마을</span>':'<b>桜町</b><span>사쿠라 마을</span>';
  const ci=$('curI'); if(ci){ ci.textContent=kr?'원':'円'; ci.parentElement.title=kr?'원':'엔'; }
  if($('qface')) $('qface').innerHTML=kr?KR_FACE:JP_FACE; if($('qname')) $('qname').textContent=kr?'까치 이장':'사루 촌장';
  const tb=$('townBtn'); if(tb){ const open=S.lv>=KR_MIN; tb.textContent=kr?'일본 마을':open?'한국 마을':`한국 Lv.${KR_MIN}`; tb.classList.toggle('locked',!open&&!kr); tb.title=kr?'사쿠라 마을(일본)로 돌아가기':open?'무궁화 마을(한국)로 가기':`레벨 ${KR_MIN}이 되면 한국 마을이 열려요`; }
  document.body.classList.toggle('kr',kr); }
function switchTown(){
  if(S.town!=='kr'&&S.lv<KR_MIN){ toast(`레벨 ${KR_MIN}이 되면 한국 마을(무궁화 마을)이 열려요`); return; }
  const snap={T:tourists(),att:attCount()}, cur={}; for(const f of TOWN_F) cur[f]=S[f];
  const nxt=S.alt||freshKr(); const firstKr=!S.alt;
  for(const f of TOWN_F) S[f]=nxt[f]; S.alt={...cur,snap}; S.town=S.town==='kr'?'jp':'kr'; applyTownUI();
  for(const k in S.tiles) if(!B[S.tiles[k].t]) delete S.tiles[k];
  moving=null; buildType=null; closePanels(); walkers=[]; tab='income'; page=Math.max(minPage(),Math.floor((S.lv-1)/5)*5+1);
  dirty=true; groundDirty=true; recompute(); while(S.qa.length<3) activate(); qSig=''; renderQuests(true); renderReq&&renderReq();
  applyTownUI(); buildTabs(); cardSig=''; buildCards(); expandInfo();
  AU.tr=0; AU.mel=null; AU.step=0; if(AU.ctx) AU.next=AU.ctx.currentTime+.25; updMusicBtn();
  save(); sfx('level');
  toast(S.town==='kr'?(firstKr?'무궁화 마을에 오신 걸 환영해요! 까치 이장이 기다리고 있어요':'무궁화 마을(한국)로 왔어요'):'사쿠라 마을(일본)로 돌아왔어요'); }
$('townBtn').onclick=switchTown;
if(!S.town) S.town='jp';
if(S.alt&&S.alt.tiles) for(const k in S.alt.tiles) if(!B[S.alt.tiles[k].t]) delete S.alt.tiles[k];
applyTownUI();

/* ===================================================== quick actions, viewing mode, photo */
function readyShops(){ const now=Date.now(), out=[]; for(const k in S.tiles){ const o=S.tiles[k]; if(o.st==='prod'&&now>=o.end&&isShop(o.t)) out.push(k); } return out; }
function idleShops(){ const out=[]; for(const k in S.tiles){ const o=S.tiles[k]; if(isShop(o.t)&&(!o.st||o.st==='idle')&&G.ok[k]) out.push(k); } return out; }
function collectAll(){ const ks=readyShops(); if(!ks.length){ toast('지금 거둘 수입이 없어요'); return; } const c0=S.coins; for(const k of ks) collect(k,true);
  save(); renderQuests(); cardSig=''; buildCards(); if(selected&&S.tiles[selected]) renderPop(); sfx('claim'); toast(`${ks.length}곳에서 ${Y}${fmt(S.coins-c0)} 거뒀어요!`); }
function startAll(){ let n=0, why=''; for(const k of idleShops()){ const r=startShop(k,false); if(r){ why=r; if(r==='e'||r==='c') break; continue; } n++; }
  if(n){ save(); cardSig=''; buildCards(); if(selected&&S.tiles[selected]) renderPop(); sfx('supply'); toast(`${n}곳 장사 시작!${why==='e'?' (기운이 다 떨어졌어요)':why==='c'?' (재료비가 부족해요)':''}`); }
  else toast(why==='e'?'기운이 부족해요':why==='c'?'재료비가 부족해요':'장사를 시작할 가게가 없어요'); }
$('collectAll').onclick=collectAll; $('startAll').onclick=startAll;
let viewing=false, viewHold=0;
function setViewing(on){ viewing=on; document.body.classList.toggle('viewing',on); $('viewbar').hidden=!on; if(on){ closePanels(); setBuild(null); viewHold=0; $('viewCap').textContent=`${S.town==='kr'?'무궁화 마을':'사쿠라 마을'} · ${SEASONS[season()].name}`; toast('감상 모드 · 화면을 끌면 직접 둘러볼 수 있어요'); } }
function viewCam(dt,now){ if(Date.now()<viewHold) return; const t=now/1000, L=Math.max(3,S.land-1);
  const tx=C+Math.sin(t*.045)*L*.55, ty=C+Math.sin(t*.031+1.3)*L*.55, tz=(W<600?.85:1.15)*(1+.18*Math.sin(t*.027)), [ix,iy]=iso(tx,ty), k=Math.min(1,dt*.35);
  z+=(tz-z)*k; ox+=((W/2-ix*z)-ox)*k; oy+=((H*.56-iy*z)-oy)*k; }
async function takePhoto(){ cv.toBlob(async b=>{ if(!b){ toast('사진을 만들지 못했어요'); return; } const name=(S.town==='kr'?'mugunghwa':'sakura')+'-town.png';
  if(DL){ try{ await DL.save({filename:name,data:b}); toast('사진을 저장했어요'); return; }catch(e){ if(e&&e.code==='declined') return; } }
  try{ const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('사진을 저장했어요'); }catch(e){ toast('이 화면에서는 사진 저장을 할 수 없어요'); } },'image/png'); }
$('viewBtn').onclick=()=>setViewing(true); $('viewExit').onclick=()=>setViewing(false); $('photoBtn').onclick=takePhoto;
setInterval(save,5000);
resize(); recompute(); buildTabs(); buildCards(); renderQuests(true); renderReq(); updMusicBtn();
document.fonts?.ready?.then(()=>{ fontsOK=1; SPR={}; VS.clear(); cardSig=''; buildCards(); });
requestAnimationFrame(frame);
})();
